name: dimple
channels:
  - garage-conda-local
dependencies:
  - python >=3.12
  - gradle >=8.11
  # python interface
  - jpype1 >=1.5.1
  # python build
  - hatchling >=1.26
  # test/lint
  - mypy >=1.15
  - ruff >=0.8.3
  - pytest >=8.3.4
  # documentation
  - mkdocs >=1.6.1
  - mkdocs-material >=9.5.49
  - mkdocstrings-python >=1.13
  # awesome-pages dependencies
  - natsort >=8.3.1
  - wcmatch >=8.3
  # pip
  - pip >=24.3
  - pip:
      - mkdocstrings-python-xref >=1.6.2
      - mkdocs-awesome-pages-plugin >=2.9.0
      - stubgenj >=0.2.12
