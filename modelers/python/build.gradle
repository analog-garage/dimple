plugins {
    id 'base'
}

tasks.register('devInstall', Exec) {
    group = 'build'
    description = 'Do a pip dev install of python package into current environment'
    workingDir = '.'
    commandLine 'pip', 'install', '-e', '.', '--no-deps', '--no-build-isolation'
}

build.dependsOn devInstall

tasks.register('ruff', Exec) {
    group = 'Verification'
    description = "Run ruff linter on python code"
    workingDir '.'
    commandLine 'ruff', 'check', 'garpy', 'tests'
}

tasks.register("mypy", Exec) {
    group = "Verification"
    description = "Run mypy type checker on python code"
    workingDir '.'
    commandLine 'mypy', 'garpy', 'tests'
}

tasks.register("mypy-verbose", Exec) {
    group = "Verification"
    description = "Run mypy type checker in verbose mode"
    workingDir '.'
    commandLine 'mypy', '-vvv', 'garpy', 'tests'
}

tasks.register("lint") {
    group = "Verification"
    description = "Runs python linting tasks: ruff and mypy"
    dependsOn ruff, mypy
}

tasks.register("pytest", Exec) {
    group = "Verification"
    description = "Run pytest tests on python code"
    workingDir '.'
    commandLine 'pytest', 'tests'
}

check.dependsOn ruff, mypy, pytest
mypy.mustRunAfter ruff
pytest.mustRunAfter ruff, mypy

