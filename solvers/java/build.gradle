/*
 * See the README file for a high level description of how the Dimple build
 * script works.
 */

plugins {
	id 'java'
	id 'jacoco'
	id 'maven-publish'
}

defaultTasks 'build'

java {
	sourceCompatibility = '22'
	targetCompatibility = '22'
}

repositories {
	mavenCentral()
//	maven {
//		url "http://mbari-maven-repository.googlecode.com/svn/repository/"
//	}
//	maven {
//		url "https://www.array.ca/nest-web/maven/"
//	}
}

sourceSets {
	main {
		resources {
			srcDirs += 'src/main/resources'
			srcDirs += 'src/benchmarking/java'
		}
	}
	benchmarking
}

dependencies {
	implementation "org.eclipse.jdt:org.eclipse.jdt.annotation:1.1.0"
	implementation 'com.google.guava:guava:33.3.1-jre'
	implementation "org.apache.commons:commons-math3:3.6.1"
	implementation "com.github.wendykierp:JTransforms:3.1"
	implementation "gov.nist.math:jama:1.0.3"
	implementation "colt:colt:1.2.0"
	implementation "net.jcip:jcip-annotations:1.0"
	implementation "junit:junit:4.13.2"
	implementation files('../non-maven-jars/javailp-1.2a.jar')

	benchmarkingImplementation sourceSets.main.runtimeClasspath
}

tasks.register('copyExternalJars', Copy) {
	from configurations.compileClasspath
	into file('../lib')
}

tasks.register('copyExternalJarsForEclipse', Copy) {
	from configurations.compileClasspath
	into file('build/external-libs')
}

tasks.register('eclipseSetup') {
	dependsOn copyExternalJarsForEclipse
	description = 'Setup external libs needed for Eclipse project.'
}

tasks.register('copyDimpleJar', Copy) {
	from jar
	into file('../lib')
}

tasks.register('versionResource', Copy) {
	dependsOn rootProject.tasks.named('longVersion')
	from dimpleLongVersionFile
	into 'src/main/resources/'
	rename 'LONG_VERSION', 'VERSION'
}

processResources.dependsOn versionResource

clean {
	delete 'src/main/resources/VERSION'
	delete '../lib'
}

jar {
	duplicatesStrategy = 'exclude'
	manifest {
		attributes(
				"Implementation-Title": "Dimple",
				"Implementation-Vendor": "Lyric Labs | Analog Devices",
				"Implementation-Version": dimpleVersion,
				"Permissions": "sandbox"
		)
	}
}

tasks.register('copyJars') {
	dependsOn copyDimpleJar, copyExternalJars, copyExternalJarsForEclipse
}

assemble.dependsOn copyJars

tasks.register('generateJavaPythonStubs', Exec) {
    group = "Build"
    description = "Generate python stubs for JPype wrappers for Java dimple"
    commandLine = [
        'env', 'python', '-m', 'stubgenj',
        '--jvmpath', System.properties.'java.home' + '/bin/java',
        '--classpath', sourceSets.main.runtimeClasspath.asPath,
        '--output-dir', '../../python',
        '--no-jpackage-stubs',
        'com.analog.lyric'
    ]
}

tasks.register('runJavaBenchmarks', JavaExec) {
	dependsOn 'benchmarkingClasses'
	mainClass.set('com.analog.lyric.dimple.benchmarks.DimpleBenchmarks')
	classpath = sourceSets.benchmarking.runtimeClasspath
	minHeapSize = '1g'
	maxHeapSize = '6g'
}

tasks.register('runMATLABBenchmarks', Exec) {
	workingDir '../..'
	commandLine 'matlab', '-nodesktop', '-nodisplay', '-nosplash', '-wait', '-r', 'try, startup; cd modelers/matlab/benchmarks; run; end; exit'
}
runMATLABBenchmarks.dependsOn 'benchmarkingClasses', 'copyExternalJars'

tasks.register('runBenchmarks') {
	dependsOn runJavaBenchmarks, runMATLABBenchmarks
}

ext {
	docSubpackages = 'com.analog.lyric'
	docExcludePackages = [
			'com.analog.lyric.dimple.examples',
			'com.analog.lyric.dimple.jsproxy',
			'com.analog.lyric.dimple.learning',
			'com.analog.lyric.dimple.matlabproxy',
			'com.analog.lyric.dimple.model.serializerdetails',
			'com.analog.lyric.dimple.model.sugar',
			'com.analog.lyric.dimple.parameters',
			'com.analog.lyric.dimple.schedulers.dependencyGraph',
			'com.analog.lyric.dimple.solvers.core.kbest',
			'com.analog.lyric.dimple.solvers.core.multithreading',
			'com.analog.lyric.dimple.solvers.gaussian',
			'com.analog.lyric.dimple.solvers.gibbs.customFactors',
			'com.analog.lyric.dimple.solvers.minsum.customFactors',
			'com.analog.lyric.dimple.solvers.sumproduct.customFactors',
			'com.analog.lyric.dimple.solvers.sumproduct.pseudolikelihood',
			'com.analog.lyric.dimple.solvers.sumproduct.sampledfactor',
			'com.analog.lyric.dimple.solvers.template',
			'com.analog.lyric.math',
			'com.analog.lyric.util'
	]
	docExclude = docExcludePackages.join(':')
}

javadoc {
	exclude docExcludePackages.collect { '**/' + it.replace('.', '/') + '/**' }
	title = 'Dimple Java API ' + dimpleVersion
	options.header = 'Dimple ' + dimpleVersion
	options.tags 'category'
}

tasks.register('javadocVersion', Copy) {
	dependsOn javadoc
	description = "Copies javadoc into version-specific directory"
	group = 'Documentation'

	from javadoc.destinationDir
	into "${javadoc.destinationDir.parent}/javadoc_v${dimpleUnderlineVersion}"
}

tasks.register('allDoc') {
	dependsOn 'javadocVersion'
	description = "Builds all documentation"
	group = 'Documentation'
}

tasks.register('sourcesJar', Jar) {
	dependsOn classes
	archiveClassifier.set('sources')
	from sourceSets.main.allSource
}

tasks.register('javadocJar', Jar) {
	dependsOn javadoc
	archiveClassifier.set('javadoc')
	from javadoc.destinationDir
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = 'dimple'

			artifact(sourcesJar) {
				classifier = "sources"
			}

			artifact(javadocJar) {
				classifier = "javadoc"
			}
		}
	}
	repositories {
		maven {
			name = "myRepo"
			url = uri("https://my.repo.url/repository/maven-releases/")
			credentials {
				username = project.findProperty("repoUser") ?: ""
				password = project.findProperty("repoPassword") ?: ""
			}
		}
	}
}
