site_name: garpy-dimple
copyright: 2012-2024 Analog Devices. Inc.
docs_dir: mkdocs/user-manual
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  custom_dir: mkdocs/user-manual/overrides
  features:
#    - navigation.footer - prev/next page
    - content.tabs.link
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky # does not seem to work
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
#    - announce.dismiss
    - toc.follow
#    - toc.integrate - would be nice in some sections, but not everywhere
  highlight_js: true
  hljs_languages:
    python
    yaml
    json
  logo: logo.jpeg
  palette:
    primary: teal
    accent: deep orange

not_in_nav: |
  viz-not-installed.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

watch:
  # path is relative to this file
  - mkdocs/

plugins:
  - search
  - autorefs
  - awesome-pages:
      filename: nav.yml
  - offline
  # See https://mkdocstrings.github.io/
  # and https://analog-garage.github.io/mkdocstrings-python-xref/1.6.0/
  - mkdocstrings:
      default_handler: python_xref
      # generate objects.inv sphinx inventory file in site/ dir to support external cross references
      enable_inventory: true
      handlers:
        python_xref:
          inventories:
            - url: https://docs.python.org/3/objects.inv
              domains: [std, py]
            - url: https://jpype.readthedocs.io/en/latest/objects.inv
            - url: https://numpy.org/doc/2.2/objects.inv

          options:
            docstring_style: google
            filters:
              - "!^_[^_]"
              - "!^__.*[^_]$"
            heading_level: 2
            show_source: true
            show_submodules: false
            show_if_no_docstring: true
            show_category_heading: true
            show_signature_annotations: true
            separate_signature: true
            docstring_section_style: spacy
            relative_crossrefs: true
            inherited_members: false

markdown_extensions:
  # Enables proper formatting of fenced code blocks in lists
  - admonition
  - footnotes
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
#          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css
