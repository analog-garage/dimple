site_name: garpy-dimple
copyright: 2012-2024 Analog Devices. Inc.
docs_dir: mkdocs/user-manual
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: en
  font:
    text: Roboto
    code: Roboto Mono
  features:
#    - navigation.footer - prev/next page
    - content.tabs.link
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky # does not seem to work
    - navigation.prune
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
#    - toc.integrate - would be nice in some sections, but not everywhere
  highlight_js: true
  hljs_languages:
    python
    yaml
    json
  logo: logo.jpeg
  palette:
    primary: teal
    accent: deep orange

not_in_nav: |
  viz-not-installed.md

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn

watch:
  # path is relative to this file
  - mkdocs/

plugins:
  - search
#  - autorefs
  - awesome-pages:
      filename: nav.yml
  - offline
  # See https://mkdocstrings.github.io/
